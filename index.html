<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글자 수 세기</title>
  <style>
    /* 외부 라이브러리 없이, 한 페이지로 동작하는 글자 수 세기 도구입니다. */
    /* 포털 첫 화면처럼: 흰 바탕, 가운데 정렬, 초록 테두리 검색창 모양 */
    body {
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 96px 16px 48px;
      color: #1a1a1a;
      background: #fff;
      text-align: center;
    }
    h1 {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #03c75a;
      margin: 0 0 28px;
    }
    textarea {
      display: block;
      width: 100%;
      min-height: 160px;
      padding: 16px 20px;
      font-family: inherit;
      font-size: 18px;
      line-height: 1.6;
      text-align: left;
      border: 2px solid #03c75a;
      border-radius: 12px;
      box-sizing: border-box;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      outline: none;
      resize: vertical;
    }
    textarea:focus {
      box-shadow: 0 4px 14px rgba(3, 199, 90, 0.25);
    }
    textarea::placeholder {
      color: #aaa;
    }
    .count {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 600;
      color: #555;
    }
    .count span {
      color: #03c75a;
    }
    .count span.over {
      color: #d32f2f;
    }
    .limit {
      display: block;
      margin-top: 16px;
      font-size: 14px;
      color: #555;
    }
    .limit input {
      width: 100px;
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    .limit input:focus {
      border-color: #03c75a;
      outline: none;
    }
    .clear {
      margin-left: 8px;
      padding: 7px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #03c75a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .clear:hover {
      background: #02b351;
    }
    .over {
      color: #d32f2f;
    }
    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <h1>글자 수 세기</h1>

  <!-- 입력 칸: 여기에 글을 적습니다. -->
  <textarea id="input" placeholder="여기에 글을 적어 보세요."></textarea>

  <!-- 제한 글자 수: 비워 두면 제한이 없습니다. -->
  <label class="limit">제한 글자 수: <input type="number" id="limit" min="0" placeholder="없음" />
    <button type="button" id="clear" class="clear">전체 지우기</button></label>

  <!-- 결과: 입력이 바뀔 때마다 실시간으로 갱신됩니다. -->
  <p class="count">공백 포함: <span id="count">0</span> · 공백 제외: <span id="countNoSpace">0</span></p>
  <p class="hint">입력 칸의 내용이 바뀔 때마다 자동으로 다시 셉니다.</p>

  <script>
    // 입력 칸과 결과 표시 영역을 가져옵니다.
    var input = document.getElementById("input");
    var countView = document.getElementById("count");
    var countNoSpaceView = document.getElementById("countNoSpace");
    var limitInput = document.getElementById("limit");
    var clearButton = document.getElementById("clear");

    // 글자 수를 세어 화면에 보여 주는 함수입니다.
    // 빈 입력이면 length가 0이므로 자연스럽게 0이 표시됩니다.
    // 공백 제외 수는 띄어쓰기, 탭, 줄바꿈을 모두 뺀 길이입니다.
    function updateCount() {
      var text = input.value;
      countView.textContent = text.length;
      countNoSpaceView.textContent = text.replace(/\s/g, "").length;

      // 제한 칸이 비어 있지 않고 공백 포함 글자 수가 제한을 넘으면 빨간색으로 보여 줍니다.
      var limit = limitInput.value === "" ? Infinity : Number(limitInput.value);
      countView.classList.toggle("over", text.length > limit);
    }

    // 입력이나 제한이 바뀔 때마다 실시간으로 다시 셉니다.
    input.addEventListener("input", updateCount);
    limitInput.addEventListener("input", updateCount);

    // 입력 칸을 비우고 글자 수를 다시 셉니다. 제한 칸은 그대로 둡니다.
    function clearInput() {
      input.value = "";
      updateCount();
      input.focus();
    }

    clearButton.addEventListener("click", clearInput);

    // 처음 화면을 열었을 때도 한 번 맞춰 둡니다.
    updateCount();
  </script>
</body>
</html>
